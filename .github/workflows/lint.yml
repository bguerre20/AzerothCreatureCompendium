name: Lint Lua

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luacheck:
    name: LuaCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run LuaCheck
        uses: lunarmodules/luacheck@v1
        with:
          args: .
